<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexdemy - AI-Powered Adaptive Quizzes</title>
    <!-- Pre-paint Theme Script to prevent flash -->
    <script>
      (function() {
        try {
          // Check if there is an active Supabase session in localStorage
          var hasSession = false;
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && (key.indexOf('-auth-token') !== -1 || key.indexOf('supabase.auth.token') !== -1)) {
              var item = localStorage.getItem(key);
              if (item && item.indexOf('access_token') !== -1) {
                hasSession = true;
                break;
              }
            }
          }
          // If unauthenticated, always enforce Flexdemy light theme for auth pages to prevent dark flash
          if (!hasSession) {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            return;
          }

          var saved = localStorage.getItem('flexdemy_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Fonts for Normal Mode and Dyslexia Mode -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Comic+Relief:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
